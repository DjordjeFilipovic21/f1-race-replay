name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-unit:
    name: Contract and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            pipeline/constraints.txt
            pipeline/test-constraints.txt

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint pipeline/constraints.txt --constraint pipeline/test-constraints.txt pytest pytest-mock "jsonschema[format-nongpl]>=4.26,<5"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse" ./pipeline
          python -m pip install --constraint pipeline/constraints.txt "$RUNNER_TEMP"/wheelhouse/*.whl

      - name: Smoke-test installed pipeline entry points outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import os; from pathlib import Path; import f1_replay_pipeline; assert not Path(f1_replay_pipeline.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve())'
          python -m f1_replay_pipeline --help
          f1-replay-pipeline --help

      - name: Run contract, unit, and pipeline tests
        run: python -m pytest tests/contracts pipeline/tests

  full-suite:
    name: Full project suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            legacy/requirements.txt
            legacy/requirements-dev.txt
            legacy/constraints.txt
            pipeline/pyproject.toml
            pipeline/constraints.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            xvfb

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint legacy/constraints.txt -r legacy/requirements-dev.txt
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse" ./pipeline
          python -m pip install --constraint legacy/constraints.txt --constraint pipeline/constraints.txt "$RUNNER_TEMP"/wheelhouse/*.whl

      - name: Smoke-test installed pipeline entry points outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import os; from pathlib import Path; import f1_replay_pipeline; assert not Path(f1_replay_pipeline.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve())'
          python -m f1_replay_pipeline --help
          f1-replay-pipeline --help

      - name: Run full test suite
        run: |
          xvfb-run -a python -m pytest
          xvfb-run -a python -m pytest legacy/tests
