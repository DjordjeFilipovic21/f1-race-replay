[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-replay-pipeline"
version = "0.1.0"
description = "Canonical Formula 1 replay data pipeline foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35,<2",
    "fastf1>=3.8.1,<3.9",
    "jsonschema>=4.23,<5",
    "jsonschema-rs>=0.48,<0.49",
    "polars>=1.40,<2",
    "referencing>=0.35,<1",
]

[project.scripts]
f1-replay-pipeline = "f1_replay_pipeline.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Minimal lint configuration (Phase 3): ruff with its default rule set
# (E4/E7/E9/F) pinned explicitly so the gate is deterministic across ruff
# releases. No new dev dependencies are added; ruff is a standalone developer
# tool installed on demand (see docs/Testing.md). target-version is the lowest
# supported matrix member (Python 3.11), matching the constraints resolver.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
